# docker-compose.yaml — TFG Ciberseguridad Industrial
# Versión: topología en estrella (ronda 2026-07-27), monitor como único nodo multi-homed.
# Estado: PENDIENTE DE VALIDAR por el alumno en su entorno real (aún no probado).
# Sustituye a la versión anterior de 2 redes compartidas (control_network/process_network).
#
# Direccionamiento (patrón: monitor siempre .2, host siempre .3, /29 por enlace):
#   net_proceso     192.168.200.0/29  -> monitor .2, plc .3
#   net_scada       192.168.201.0/29  -> monitor .2, scada .3
#   net_historian   192.168.202.0/29  -> monitor .2, historian .3
#   net_workstation 192.168.203.0/29  -> monitor .2, workstation .3
#   net_attacker    192.168.204.0/29  -> monitor .2, attacker .3
#
# Cada host (plc, scada, historian, workstation, attacker) necesita UNA única ruta
# nueva en su arranque: `ip route add 192.168.0.0/16 via <IP del monitor en su enlace>`
# — sustituye a las rutas /32 por-vecino de la versión anterior.

networks:
  net_proceso:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/29
    driver_opts:
      com.docker.network.bridge.name: "br_proceso"
  net_scada:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.201.0/29
    driver_opts:
      com.docker.network.bridge.name: "br_scada"
  net_historian:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.202.0/29
    driver_opts:
      com.docker.network.bridge.name: "br_historian"
  net_workstation:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.203.0/29
    driver_opts:
      com.docker.network.bridge.name: "br_workstation"
  net_attacker:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.204.0/29
    driver_opts:
      com.docker.network.bridge.name: "br_attacker"

volumes:
  historian_data:

services:
  plc:
    build: ./traffic-plc
    container_name: plc_simulator
    hostname: plc
    networks:
      net_proceso:
        ipv4_address: 192.168.200.3
    ports:
      - "5020:5020"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('localhost',5020)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  historian:
    build: ./historian
    container_name: historian_db
    hostname: historian
    networks:
      net_historian:
        ipv4_address: 192.168.202.3
    cap_add:
      - NET_ADMIN
    environment:
      POSTGRES_DB: industrial_data
      POSTGRES_USER: scada_tfg
      POSTGRES_PASSWORD: scada_pass_tfg
    volumes:
      - historian_data:/var/lib/postgresql/data
    restart: unless-stopped

  monitor:
    build: ./docker
    container_name: monitor_zeek
    hostname: monitor
    networks:
      net_proceso:
        ipv4_address: 192.168.200.2
      net_scada:
        ipv4_address: 192.168.201.2
      net_historian:
        ipv4_address: 192.168.202.2
      net_workstation:
        ipv4_address: 192.168.203.2
      net_attacker:
        ipv4_address: 192.168.204.2
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./docker/captura:/capture
      - ./docker/zeek/zeek_logs:/zeek_logs
      - ./docker/zeek:/zeek_config
    restart: unless-stopped
    depends_on:
      - plc

  scada:
    build: ./scada
    container_name: scada_server
    hostname: scada
    networks:
      net_scada:
        ipv4_address: 192.168.201.3
    ports:
      - "8080:8080"
      - "2222:22" #SSH expuesto pues el ataque va por red interna
    cap_add:
      - NET_ADMIN
    depends_on:
      plc:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PLC_HOST=192.168.200.3
      - PLC_PORT=5020

  workstation:
    build: ./workstation
    container_name: workstation_eng
    hostname: workstation
    networks:
      net_workstation:
        ipv4_address: 192.168.203.3
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      plc:
        condition: service_healthy

  attacker:
    build: ./attacker
    container_name: attacker_node
    hostname: attacker
    networks:
      net_attacker:
        ipv4_address: 192.168.204.3
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    volumes:
      - ./attacker/scripts:/scripts
      - ./attacker/start.sh:/start.sh
    command: sh /start.sh
    restart: "no"
